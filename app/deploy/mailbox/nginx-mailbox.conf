# One extra vhost, on loopback only, for cloudflared to point at. It adds nothing else to the box: no other vhost is touched.
# (The mailbox answers browsers' CORS preflights itself with --cors, so nothing CORS-related is needed here.)
server {
  listen 127.0.0.1:8081;
  server_name mail.example.org;            # your mailbox hostname
  client_max_body_size 70m;                # the server's own cap is 64 MiB per object
  location / {
    proxy_pass http://127.0.0.1:8792;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $host;
  }
}
