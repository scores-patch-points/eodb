import {openSpace} from './engine.mjs';
import {fetchSharedFile} from './net.mjs';
import * as B from './vendor/pharos/browser-store.mjs';
const cells=await (await fetch('./vendor/pharos/cells.json')).json();
const names=await (await fetch('./vendor/node-names.json')).json().catch(()=>[]);
const join=new URLSearchParams(location.hash.slice(1)).get('join')||undefined;
const file=new URLSearchParams(location.hash.slice(1)).get('file')||undefined;
// spaces are host-level: each is its own pharos with its own keys and its own IndexedDB store, encrypted separately.
const spaceName=()=>localStorage.getItem('eodb-space')||(JSON.parse(localStorage.getItem('eodb-spaces')||'[]')[0])||'Work';
const keymodeFor=async(space)=>{try{return await (await B.autoBackend('eodb-log-'+(space||spaceName()))).backend.getMeta('keymode');}catch{return null;}};
const open=async(opts={})=>{const space=opts.space||spaceName();const log=await B.autoBackend('eodb-log-'+space),blobs=await B.autoBackend('eodb-blobs-'+space);window.__SPACE=space;
 window.__ENGINE_READY=openSpace({name:space,backend:log.backend,blobBackend:blobs.backend,cells,names,join,...opts}).then(e=>{window.ENGINE=e;window.__NET=()=>({graph:e.networkGraph(),dot:e.networkDot(),mermaid:e.networkMermaid()});if(join)history.replaceState(null,'',location.pathname+location.search);return e;},err=>{window.__ENGINE_ERROR=err;return null;});return window.__ENGINE_READY;};
import * as KhoraText from './vendor/khora-text.js';window.KhoraText=KhoraText;
import {makeMeasuredLoop} from './measured-loop.mjs';window.makeMeasuredLoop=makeMeasuredLoop;
window.PERSONA_RULES=await (await fetch('./persona/rules.json')).json().catch(()=>[]);
window.__EODB_BOOT={join,file,open,keymodeFor};
</script>
<script type="module">

window.Automation=Automation;
window.Relational=Relational;
</script>

function renderNetwork(){
  const g=ENGINE.networkGraph(), el=document.getElementById('net-canvas'); if(!el)return;
  const W=Math.max(el.clientWidth,560), H=430, cx=W/2, cy=H/2, pos={};
  const spaceN=g.nodes.find(n=>n.kind==='space');
  const devices=g.nodes.filter(n=>n.kind==='device');
  const transports=g.nodes.filter(n=>n.kind==='transport');
  if(spaceN)pos[spaceN.id]={x:cx,y:cy};
  devices.forEach((n,i)=>{const a=2*Math.PI*i/Math.max(1,devices.length)-Math.PI/2;pos[n.id]={x:cx+112*Math.cos(a),y:cy+112*Math.sin(a)};});
  transports.forEach((n,i)=>{const a=2*Math.PI*i/Math.max(1,transports.length)-Math.PI/2;pos[n.id]={x:cx+208*Math.cos(a),y:cy+208*Math.sin(a)};});
  let svg='<svg class="net-svg" width="'+W+'" height="'+H+'">';
  for(const e of g.edges){const a=pos[e.from],b=pos[e.to];if(!a||!b)continue;
    const col=e.kind==='member'?'var(--line2)':e.status==='down'?'var(--bad)':e.status==='inferred'?'var(--mut)':'var(--ok)';
    const dash=e.kind==='member'?' stroke-dasharray="4 4"':e.status==='inferred'?' stroke-dasharray="3 3"':'';
    svg+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="'+col+'" stroke-width="2"'+dash+'/>';}
  svg+='</svg>';
  let html=svg;
  for(const n of g.nodes){const p=pos[n.id];if(!p)continue;
    if(n.kind==='space')html+='<div class="net-node space" style="left:'+(p.x-34)+'px;top:'+(p.y-16)+'px">'+esc(n.label)+'</div>';
    else if(n.kind==='device')html+='<div class="net-node device'+(n.self?' self':'')+'" style="left:'+(p.x-66)+'px;top:'+(p.y-30)+'px"><div class="nm">'+nodeLabel(n.label)+'</div>'+(n.uuid?'<div class="uid">'+esc(n.uuid)+'</div>':'')+(n.self?'<div class="you">this device</div>':'')+'</div>';
    else html+='<div class="net-node transport'+(n.ok===false?' down':'')+'" style="left:'+(p.x-52)+'px;top:'+(p.y-13)+'px"><span class="dot"></span>'+esc(n.label)+'</div>';}
  el.innerHTML=html;
}

  for(const f of fields[0]){
   const key=f.n.toLowerCase();
   if(fields.slice(1).every(fs=>fs.some(x=>{const xn=x.n.toLowerCase();return xn.includes(key)||key.includes(xn);}))){
    shared=f;break;}
  }
 }
 if(!shared)return {answer:'No shared field found between '+mentioned.map(t=>t.name).join(' and ')+'.',steps:['no join key'],mech:true};
 const fieldIn=(tb,name)=>tb.f.find(f=>f.n.toLowerCase()===name.toLowerCase())||tb.f.find(f=>{const a=f.n.toLowerCase(),b=name.toLowerCase();return a.includes(b)||b.includes(a);});
 const name0=shared.n, name1=CROSS_ALIAS[name0.toLowerCase()]||name0;
 const t0=mentioned[0],t1=mentioned[1];
 const f0=fieldIn(t0,name0), f1=fieldIn(t1,name1);
 if(!f0||!f1)return {answer:'Could not find join field in both tables.',steps:['no join field'],mech:true};
 const results=[];
 for(const r0 of t0.r){
  const v0=r0.v[f0.id];const matches=t1.r.filter(r1=>r1.v[f1.id]===v0);
  if(matches.length){
   const agg0={},agg1={};
   for(const f of t0.f){const vals=t0.r.filter(r=>r.v[f0.id]===v0).map(r=>Number(r.v[f.id])).filter(n=>!isNaN(n));if(vals.length)agg0[f.n]=vals.reduce((a,b)=>a+b,0);}
   for(const f of t1.f){const vals=matches.map(r=>Number(r.v[f.id])).filter(n=>!isNaN(n));if(vals.length)agg1[f.n]=vals.reduce((a,b)=>a+b,0);}
   results.push({key:v0,agg0,agg1,count:matches.length});
  }
 }
 if(!results.length)return {answer:'No matching rows found between '+t0.name+' and '+t1.name+' on "'+shared.n+'".',steps:['join on '+shared.n+' \u2192 0 matches'],mech:true};
 const lines=['Cross-reference: '+t0.name+' \u2194 '+t1.name+' (join on "'+shared.n+'")'];
 for(const res of results){
  const parts=[res.key+':'];
  for(const [k,v] of Object.entries(res.agg0))parts.push(t0.name+'.'+k+'='+v);
  for(const [k,v] of Object.entries(res.agg1))parts.push(t1.name+'.'+k+'='+v);
  const a0=Object.values(res.agg0).find(v=>typeof v==='number');const a1=Object.values(res.agg1).find(v=>typeof v==='number');
  if(a0&&a1&&a1>0){const ratio=a0/a1;if(ratio>2)parts.push('RATIO '+ratio.toFixed(1)+':1 \u2014 EXCEEDS 2:1');}
  lines.push(parts.join(' | '));
 }
 return {answer:lines.join('\n'),steps:['joined '+t0.name+' \u2194 '+t1.name+' on "'+shared.n+'" \u2192 '+results.length+' match'+(results.length===1?'':'es')],mech:true};}

// EVA: evaluate the mouth's output against the void (instruction rules). Returns {ok, violations}.
function evaRules(answer){const v=[];const t=String(answer||'');
 if(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}]/u.test(t))v.push('emoji');
 if(/^[-*]\s/m.test(t))v.push('bullet');
 if(/as an (AI|language model|assistant)/i.test(t))v.push('framing');
 if(/genuinely|honestly|straightforward/i.test(t))v.push('banned-word');
 if(t.length>600)v.push('too-long');
 return {ok:v.length===0,violations:v};}
// REC: re-ground the mouth's output — strip violations mechanically (the floor).
function recRules(answer){let t=String(answer||'');
 t=t.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}]/gu,'');
 t=t.replace(/^[-*]\s+/gm,'');
 t=t.replace(/as an (AI|language model|assistant)[^\n]*[.!?]?\s*/gi,'');
 t=t.replace(/genuinely|honestly|straightforward/gi,'');
 t=t.replace(/\n{3,}/g,'\n\n');
 return t.trim();}
// voice(): the mouth (model) is not the voice. The voice mechanically cleans what the mouth said.
function voice(raw){if(!raw)return '';let t=String(raw);
 t=t.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F000}-\u{1F02F}\u{1F0A0}-\u{1F0FF}\u{1F100}-\u{1F1FF}\u{1F200}-\u{1F2FF}\u{1F300}-\u{1F5FF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{1F910}-\u{1F96B}\u{1F980}-\u{1F9E0}]/gu,'');
 t=t.replace(/^[-*]\s+/gm,'');
 t=t.replace(/as an (AI|language model|assistant)[^\n]*[.!?]?\s*/gi,'');
 t=t.replace(/^ANSWER:\s*/i,'');
 const seen=new Set();const lines=t.split(/(?<=[.!?])\s+/);const kept=[];
 for(const l of lines){const k=l.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,60);if(k&&seen.has(k))continue;if(k)seen.add(k);kept.push(l);}
 t=kept.join(' ');
 t=t.replace(/\n{3,}/g,'\n\n');
 return t.trim();}
// ---- web research (foldcode's researching capacity, toy version) ----
// search the web (Wikipedia, direct, no proxy), fetch the article, read it, ground the answer in it
async function webSearch(q){try{const r=await fetch('https://en.wikipedia.org/w/api.php?action=opensearch&search='+encodeURIComponent(q)+'&limit=5&namespace=0&format=json');const d=await r.json();return (d[1]||[]).map((t,i)=>({title:t,url:d[3][i]}));}catch(e){return[];}}
async function fetchArticle(title){try{const r=await fetch('https://en.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&titles='+encodeURIComponent(title)+'&format=json');const d=await r.json();const pages=d.query&&d.query.pages;const p=pages&&Object.values(pages)[0];return (p&&p.extract)||'';}catch(e){return'';}}
async function research(q){
 const results=await webSearch(q);const ground=[];
 for(const res of results.slice(0,3)){const text=await fetchArticle(res.title);if(text.length>100){const snip=text.slice(0,800);ground.push('Wikipedia "'+res.title+'": '+snip);}}
 if(!ground.length)return null;
 const facts=ground;const user='DATA:\n'+facts.join('\n\n')+'\n\nQuestion: '+q;
 let mouth=null;try{mouth=await askModel(user,personaFor(q));}catch(e){mouth=null;}
 const answer=mouth?voice(mouth):(fallbackAnswer(q,facts));
 const checks=gradeAnswer(answer,facts);
 return {answer,facts,system:personaFor(q),user,checks,mouth};}
function mechAnswer(q,att){const v=defVoid(q);const r=evaAgainst(v,att);if(r.filled)return {answer:r.answer,steps:r.steps,mech:true};const cross=mechCross(q);if(cross)return cross;return null;}
// conversation recall: the recent messages, plus any older message that shares a content word with the question.
// A rolling window keeps short-term coherence; keyword recall reaches back across a long conversation.
function chatContext(q,c){if(!c)return'';const done=c.msgs.filter(m=>m.text&&!m.pending);if(!done.length)return'';const recent=done.slice(-12);const toks=askToks(q).filter(w=>w.length>4);const older=done.slice(0,-12);const rec=[];if(toks.length&&older.length){for(const m of older){const mt=(m.text||'').toLowerCase();const h=toks.filter(w=>mt.includes(w)).length;if(h)rec.push({m,h});}rec.sort((a,b)=>b.h-a.h);}const parts=[];if(rec.length)parts.push('Recalled from earlier:\n'+rec.slice(0,4).map(r=>(r.m.role==='user'?'User: ':'Assistant: ')+r.m.text).join('\n'));parts.push('Recent:\n'+recent.map(m=>(m.role==='user'?'User: ':'Assistant: ')+m.text).join('\n'));return parts.join('\n\n');}
async function ask(q,att,onChunk){const t=String(q||'').trim().toLowerCase();const greet=/^(hi|hello|hey|how are you|whats up|what's up|yo|sup|good (morning|afternoon|evening))\b/.test(t);
 if(!(att&&att.length)&&greet){return {answer:'Doing well \u2014 what can I help you with?',facts:[],system:personaFor(q),user:q,checks:[],mech:true};}
 const mech=mechAnswer(q,att);if(mech){return {answer:mech.answer,facts:[],system:'(mechanical \u2014 no model)',user:q,checks:[{s:mech.steps.join(' \u2192 '),standing:'supported'}],mech:true};}
 const facts=retrieve(q,att);const withData=facts.length>0||(att&&att.length>0);
 const isMath=/\d/.test(q)&&/[+\-*/=]/.test(q);const isResearch=/\b(research|look up|find out|explain)\b/i.test(q)&&!withData&&!greet&&!isMath;
 const c=curChat();const lastUser=c?c.msgs.filter(m=>m.role==='user').at(-1):null;const lastSys=c?c.msgs.filter(m=>m.role==='sys'&&m.text).at(-1):null;
 if(isResearch){const r=await research(q);if(r){const checks=gradeAnswer(r.answer,r.facts);return {answer:r.answer,mouth:r.mouth,facts:r.facts,system:r.system,user:r.user,checks,err:null,mech:false};}}
 const isFollow=!withData&&!att.length&&/^(which one|what about|how about|tell me more|and him|and her|and them|more on|elaborate|expand)\b/i.test(q.trim())&&lastSys;
  const system=withData?(personaFor(q)+DATA_RULE):'You are a helpful assistant. Answer directly and concisely. Do not make up data or describe databases unless asked.';
  const hist=(!withData&&!isFollow&&c)?chatContext(q,c):'';
  const user=withData?('DATA:\n'+facts.join('\n')+'\n\nQuestion: '+q):(isFollow?('Previous answer: '+lastSys.text+'\n\nFollow-up question: '+q):(hist?('Conversation so far:\n'+hist+'\n\nQuestion: '+q):q));
  // The model is the MOUTH (it only emits raw candidates); the system is the VOICE (it evaluates, re-grounds, selects, and shapes what is said).
  // The loop is bound by the MEASURED loop, not a hand-set count: each round reports how much remains unresolved (the falsifier's
  // unsupported/contradicted count), and the streaming-DMD growth of that count decides whether to keep repairing or stop.
  let answer=null,err=null,mouths=[],recCount=0,checks=[],lastV=null;
  const ML=window.makeMeasuredLoop?window.makeMeasuredLoop({ceiling:6}):null;
  let best=null;
  for(let round=0;;round++){
   let m=null;
   try{m=await askModel(round===0?user:('DATA:\n'+facts.join('\n')+'\n\nQuestion: '+q+'\n\nAnswer using only the DATA above, and cite the numbers you use.'),system,round===0?onChunk:null);}catch(e){err=e;}
   if(!m)break;
   const eva=evaRules(m);if(!eva.ok)recCount++;
   const spoken=voice(eva.ok?m:recRules(m));
   mouths.push({spoken});
   const c=gradeAnswer(spoken,facts);
   const bad=c.filter(x=>x.standing==='unsupported'||x.standing==='contradicted').length;
   if(!best||bad<best.bad)best={spoken,checks:c,bad};
   if(!ML)break;
   ML.push(bad);lastV=ML.verdict();
   if(!lastV.continue)break;
  }
  if(best){answer=best.spoken;checks=best.checks;}
  if(!answer){answer=facts.length?fallbackAnswer(q,facts):'I couldn\'t reach the local model. Is Ollama running on port 11434?';}
  const stopped=lastV?lastV.verdict:'aborted';
  const trace='measured loop '+stopped+' after '+mouths.length+' mouth call'+(mouths.length===1?'':'s')+(recCount?(' ('+recCount+' eva clean'+(recCount===1?'':'s')+')'):'');
  checks.push({s:trace,standing:(best&&best.bad===0)?'supported':'partial'});
  return {answer,mouth:mouths.length?mouths[0].spoken:null,facts,system,user,checks,err:err&&String(err.message||err)};}
function vChat(){const c=curChat();
 let h=crumb(ic('chat-circle-text')+' Ask')+'<h1 style="display:flex;align-items:center;gap:6px">Ask'+(c?'<button class="cicon" title="New thread here" aria-label="New thread" style="margin-left:auto" onclick="newThread()">'+ic('chat-text')+'</button>':'')+'</h1>';
 const msgs=c?c.msgs.map(m=>'<div class="cmsg '+(m.role==='user'?'cu':'cs')+'"><div class="cbody">'+(m.att&&m.att.length?'<div class="catts">'+m.att.map(a=>'<span class="chip c-b">'+ic('paperclip')+' '+esc(a.name)+'</span>').join('')+'</div>':'')+(m.pending?'<span class="think">thinking\u2026</span>':md(m.text))+(m.system?'<details class="cground"><summary>prompt</summary><pre class="cp">'+esc('system: '+m.system+'\n\nuser: '+m.user)+'</pre></details>':'')+(m.checks&&m.checks.length?'<details class="cground"><summary>checked (Murch pace + fold falsify)</summary>'+m.checks.map(x=>'<div class="ck '+x.standing+'">'+(x.standing==='supported'?'\u2713':x.standing==='partial'?'~':'\u26a0')+' '+esc(x.s)+'</div>').join('')+'</details>':'')+(m.facts&&m.facts.length?'<details class="cground"><summary>thinking ('+m.facts.length+')</summary>'+esc(m.facts.join('\n')).replace(/\n/g,'<br>')+'</details>':'')+'</div></div>').join(''):'';
 const welcome='<div class="welcome"><div class="bmark">'+ic('chat-circle-text')+'</div><h2>Ask anything</h2><p class="note">A general assistant that can also answer about your files, tables and notes. Every reply is grounded and checked before it is spoken.</p></div>';
 const attrow=U.att.length?'<div class="catts">'+U.att.map((a,i)=>'<span class="chip c-b">'+ic('paperclip')+' '+esc(a.name)+' <button class="xd" onclick="detach('+i+')">'+ic('x')+'</button></span>').join('')+'</div>':'';
  const input='<div class="cinput">'+(attrow?'<div>'+attrow+'</div>':'')+'<div class="composer"><button class="cicon" title="Attach" aria-label="Attach" onclick="pickAttach()">'+ic('paperclip')+'</button><textarea id="cq" rows="1" placeholder="Ask anything\u2026" onkeydown="cqKey(event)" oninput="cqGrow(this)"></textarea><button class="cicon csend" id="csend" title="Send" aria-label="Send" disabled onclick="askSend()">'+ic('arrow-right')+'</button></div></div>';
 return '<div class="cchat">'+h+'<div class="cmsgs">'+(c&&c.msgs.length?msgs:welcome)+'</div>'+input+'</div>';}
function cqGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,200)+'px';const b=document.getElementById('csend');if(b){const on=!!(el.value.trim());b.disabled=!on;b.classList.toggle('on',on);}}
function cqKey(e){if(e.key==='Enter'&&!e.shiftKey){if(e.isComposing||e.keyCode===229)return;e.preventDefault();askSend();}}
async function askSend(){const el=document.getElementById('cq');const q=(el&&el.value||'').trim();if(!q)return;el.value='';cqGrow(el);const long=/^(longform|write|report):/i.test(q);const q0=q.replace(/^(longform|write|report):\s*/i,'');let c=curChat();if(!c){c={id:uid('c'),title:q.slice(0,40),msgs:[]};U.chats.unshift(c);U.chatId=c.id;}
 const att=U.att.slice();U.att=[];
 c.msgs.push({role:'user',text:q,att});
 c.msgs.push({role:'sys',text:'',pending:true});
 render();focusId('cq');
 const bubble=[...document.querySelectorAll('.cmsg.cs .cbody')].pop();
 const r=long?await longform(q0,att,(tok)=>{const m=c.msgs[c.msgs.length-1];m.text+=tok;m.pending=false;if(bubble)bubble.innerHTML=md(m.text);}):await ask(q0,att,(tok)=>{const m=c.msgs[c.msgs.length-1];m.text+=tok;m.pending=false;if(bubble)bubble.innerHTML=md(m.text);});
 c.msgs[c.msgs.length-1]={role:'sys',text:r.answer,facts:r.facts,system:r.system,user:r.user,checks:r.checks};
 render();focusId('cq');}

function storebar(){let b=document.getElementById('storebar');const r=ENGINE.report();const bad=r.lastError||r.damaged.length||r.gaps.length;const pending=r.unpersisted;
 if(!bad&&!pending){if(b)b.remove();return;}
 if(!b){b=document.createElement('div');b.id='storebar';document.body.appendChild(b);}
 b.className='bad';b.textContent=bad?('Not saved: '+(r.lastError||(r.damaged+' damaged, '+r.gaps+' missing'))+(pending?' ('+pending+' waiting)':'')):('Saving… '+pending+' pending');}
(async()=>{await boot();render();storebar();setInterval(storebar,1000);})();
